[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon_product_search_v2"
version = "0.1.2"
description = "A library to search products on Amazon without using the PA API"
readme = "README.md"
authors = [
    { name = "Manojpanda", email = "manojpandawork@gmail.com" }
]
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["amazon", "product", "search", "scraping", "web scraping"]
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.11.0",
    "curl_cffi>=0.13.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.4",
    "coverage>=7.0",
]

[tool.pytest.ini_options]
markers = [
    "live: opt-in live-network smoke test against Amazon (skipped by default)",
]

[tool.coverage.run]
source = ["amazon_product_search"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
]


[project.urls]
Homepage = "https://github.com/ManojPanda3/amazon-product-search"
