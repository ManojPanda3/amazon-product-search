name: Docs

# Developer usage page (site/index.html, plain static HTML, no build step).
# Deploys to GitHub Pages on every version tag. Requires one-time repo
# setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    tags:
      - "v*" # e.g. v0.1.3 — same convention as the PyPI publish workflow
  workflow_dispatch: # manual re-publish from the Actions tab

permissions:
  contents: read
  pages: write # deploy to GitHub Pages
  id-token: write # OIDC for deploy-pages

# Single Pages deployment at a time; queued runs wait instead of cancelling.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Gate the docs publish on the offline test suite so a tag never ships
  # a page describing broken behaviour.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + test extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run pytest (offline, live deselected)
        run: python -m pytest tests/ -q -m "not live"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/ # plain HTML — no build step needed

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
