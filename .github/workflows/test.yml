name: Tests

on:
  push: # every push, any branch
  pull_request: # and every PR (merge checks)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test extras
        run: python -m pip install -e ".[test]"

      - name: Run pytest (offline, live deselected)
        run: python -m pytest tests/ -q -m "not live"

      - name: Coverage gate >=85% on parsing layer
        if: matrix.python-version == '3.12'
        run: |
          coverage run -m pytest tests/ -q -m "not live"
          coverage report --include="amazon_product_search/*" --fail-under=85

  # Stable gate for branch protection.
  #
  # The matrix above reports as "test (3.9)" and "test (3.12)", so a
  # required status check named "test" would never be satisfied and the
  # PR would sit blocked forever. This job publishes exactly one check
  # named "test", and it only passes when every matrix job passes.
  gate:
    name: test
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: All matrix checks passed
        run: echo "python 3.9 and 3.12 both green"